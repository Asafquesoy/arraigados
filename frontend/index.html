<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- webp: mismo archivo que ya usa Navbar/Hero (ver Navbar.tsx, Hero.tsx) —
         si el favicon apuntara a logo.png en vez de logo.webp, el navegador
         tendría que descargar los dos (no comparten caché al ser URLs
         distintas), anulando el ahorro de convertir el logo a WebP. -->
    <link rel="icon" type="image/webp" href="/logo.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14210F" />
    <title>Arraigados — Registro de campamento</title>
    <meta
      name="description"
      content="Registro oficial del campamento Arraigados, Dúnamis. Del 13 al 16 de noviembre de 2026 en Campamento Mahanaim, Tamaulipas."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Arraigados 2026 — Registro de campamento" />
    <meta
      property="og:description"
      content="Del 13 al 16 de noviembre de 2026 en Campamento Mahanaim, Tamaulipas. Regístrate y sube tu comprobante de pago."
    />
    <meta property="og:image" content="/poster.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- type="image/webp" hace que el navegador ignore este preload si no
         soporta WebP (todos los navegadores modernos sí) — el <picture> del
         Hero (ver Hero.tsx) sirve el JPG como fallback real para esos casos,
         solo sin la ventaja del preload. -->
    <link
      rel="preload"
      as="image"
      href="/poster-800.webp"
      imagesrcset="/poster-800.webp 800w, /poster-1600.webp 1600w, /poster-2200.webp 2200w"
      imagesizes="100vw"
      type="image/webp"
      fetchpriority="high"
    />
    <!-- Fuentes auto-hospedadas (ver src/styles/fonts.css) — ya no hay
         origen externo al que preconectar. Solo se precargan las dos que
         aparecen arriba del pliegue en el Hero (título + texto); IBM Plex
         Mono no se usa ahí, así que carga por demanda cuando hace falta. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/bagel-fat-one-latin-400.woff2" crossorigin />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/bricolage-grotesque-latin-variable.woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
