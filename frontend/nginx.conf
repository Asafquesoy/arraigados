server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    # Sin esto, cada visita descarga el JS/CSS del build sin comprimir — el
    # bundle principal pasa de ~96KB a ~295KB. woff2 y las imágenes no se
    # incluyen porque ya vienen comprimidos (gzip encima solo agrega overhead).
    #
    # gzip_http_version 1.0 / gzip_proxied any: en producción este nginx está
    # detrás de otro nginx (el del servidor, con Certbot) que reenvía las
    # peticiones con HTTP/1.0. Por defecto nginx solo comprime a partir de
    # HTTP/1.1, así que sin estas dos líneas el JS y el CSS llegaban SIN
    # comprimir aunque el resto de esta configuración pidiera gzip. El nginx
    # del servidor deja pasar la respuesta ya comprimida tal cual.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_http_version 1.0;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        text/javascript
        text/css
        text/html
        application/json
        image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html nunca lleva hash en el nombre — si quedara cacheado, un
    # deploy nuevo serviría HTML viejo apuntando a chunks JS/CSS que ya no
    # existen en el servidor.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Los demás assets sí llevan hash de contenido en el nombre
    # (index-DarOXIbL.js), así que un año de cache es seguro: un cambio de
    # contenido siempre produce un nombre de archivo distinto.
    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
