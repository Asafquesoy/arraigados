server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    # Sin esto, cada visita descarga el JS/CSS del build sin comprimir — el
    # bundle principal pasa de ~108KB a ~330KB. woff2 no se incluye porque ya
    # viene comprimido internamente (gzip encima solo agrega overhead).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        text/css
        text/html
        application/json
        image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html nunca lleva hash en el nombre — si quedara cacheado, un
    # deploy nuevo serviría HTML viejo apuntando a chunks JS/CSS que ya no
    # existen en el servidor.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Los demás assets sí llevan hash de contenido en el nombre
    # (index-DarOXIbL.js), así que un año de cache es seguro: un cambio de
    # contenido siempre produce un nombre de archivo distinto.
    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
