services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arraigados}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arraigados}
      POSTGRES_DB: ${POSTGRES_DB:-arraigados}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arraigados}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-arraigados}:${POSTGRES_PASSWORD:-arraigados}@db:5432/${POSTGRES_DB:-arraigados}
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
      TICKETS_DIR: /data/tickets
    volumes:
      - tickets:/data/tickets
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  tickets:
